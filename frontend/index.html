<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="/ui/styles.css">
  </head>
  <body>
    <main class="container">
      <h1>Calculadora de IMC</h1>
      <form id="bmi-form">
        <label for="weight">Peso (kg)</label>
        <input id="weight" name="weight" type="number" min="0" step="any" required>

        <label for="height">Altura (m)</label>
        <input id="height" name="height" type="number" min="0" step="any" required>

        <button id="calculate-button" type="submit">Calcular IMC</button>
      </form>

      <section id="result" aria-live="polite"></section>
      <p class="notice">El resultado es informativo y no constituye un diagnostico medico.</p>

      <form id="email-form">
        <label for="email">Correo electronico</label>
        <input id="email" name="email" type="email">
        <button id="email-button" type="submit" disabled>Enviar por correo</button>
      </form>
      <section id="status" aria-live="polite"></section>
    </main>
    <script src="/ui/app.js"></script>
  </body>
</html>
